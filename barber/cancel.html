<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annulation — RENDEVO</title><style>body{margin:0;background:#171613;color:#f2eadb;font:16px/1.6 system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.card{width:min(540px,calc(100% - 36px));padding:28px;border:1px solid #3b372f;border-radius:18px;background:#211f1a}h1{font:500 32px Georgia,serif}.brand{letter-spacing:.18em;font-weight:800}.brand span{color:#c7a978}.msg{color:#b8b0a1}.btn{background:#c7a978;color:#191711;border:0;border-radius:30px;padding:12px 18px;font-weight:700;cursor:pointer}a{color:#c7a978}</style></head><body><main class="card"><div class="brand">RENDEVO<span>.</span></div><h1>Annuler un rendez-vous</h1><p class="msg" id="status">Vérification du lien…</p><button class="btn" id="cancel" hidden>Confirmer l’annulation</button><p><a href="./">Retour à la réservation</a></p></main><script src="./config.js"></script><script>const q=new URLSearchParams(location.search),ref=q.get("reference"),token=q.get("token"),status=document.querySelector("#status"),btn=document.querySelector("#cancel");function call(params){return new Promise((resolve,reject)=>{if(!window.RENDEVO_CONFIG?.API_URL||!window.RENDEVO_CONFIG.API_URL.startsWith("https://script.google.com/"))return reject(Error("Le backend n’est pas encore configuré."));const cb="cancel_"+Math.random().toString(36).slice(2),u=new URL(window.RENDEVO_CONFIG.API_URL);Object.entries({...params,callback:cb}).forEach(([k,v])=>u.searchParams.set(k,v));const s=document.createElement("script"),t=setTimeout(()=>{delete window[cb];s.remove();reject(Error("Délai dépassé."))},15000);function done(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{done();d?.success?resolve(d):reject(Error(d?.message||"Erreur"))};s.onerror=()=>{done();reject(Error("Serveur inaccessible."))};s.src=u.toString();document.body.appendChild(s)})}if(ref&&token){status.textContent="Référence : "+ref+". Confirmez uniquement si vous souhaitez annuler.";btn.hidden=false}else status.textContent="Lien incomplet. Ouvrez le lien privé complet reçu lors de la réservation.";btn.onclick=async()=>{btn.disabled=true;status.textContent="Annulation en cours…";try{const r=await call({action:"cancel",reference:ref,token});status.textContent=r.message;btn.hidden=true}catch(e){status.textContent=e.message;btn.disabled=false}}</script></body></html>
